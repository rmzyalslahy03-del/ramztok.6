<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | المصادقة الثنائية</title>
  <style>/* نفس الأنماط العامة */ *{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#000;color:white;height:100vh;overflow:hidden;}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;flex-direction:row-reverse;justify-content:space-around;align-items:center;padding:8px 0 12px;border-top:1px solid #222;z-index:100;}.nav-item{display:flex;flex-direction:column;align-items:center;color:#aaa;font-size:12px;text-decoration:none;transition:color 0.2s;}.nav-item i{font-size:24px;margin-bottom:3px;}.nav-item.active{color:#ff2a55;}.top-bar{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:90;}.left-icons{display:flex;gap:16px;}.search-icon,.live-icon{color:white;font-size:22px;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;}.top-tabs{display:flex;gap:30px;font-weight:bold;position:absolute;left:50%;transform:translateX(-50%);}.tab-link{color:#aaa;text-decoration:none;padding-bottom:4px;font-size:16px;}.tab-link.active{color:white;border-bottom:2px solid #ff2a55;}.page-container{padding:70px 16px 80px;height:100vh;overflow-y:auto;}.section-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:20px;}.card{background:#1a1a1a;border-radius:24px;padding:24px;text-align:center;max-width:450px;margin:0 auto;}.qrcode{width:160px;height:160px;background:#333;margin:16px auto;display:flex;align-items:center;justify-content:center;border-radius:16px;}.otp-input{width:100%;padding:12px;margin:16px 0;border-radius:12px;border:none;background:#2c2c2c;color:white;text-align:center;font-size:20px;letter-spacing:4px;}.btn-primary{background:#ff2a55;border:none;padding:12px;border-radius:30px;color:white;font-weight:bold;width:100%;cursor:pointer;}.switch-text{color:#aaa;margin-top:16px;}#globalToast{position:fixed;bottom:80px;left:20px;right:20px;background:#1f1f1f;color:white;padding:12px 16px;border-radius:40px;text-align:center;z-index:1000;opacity:0;transition:opacity 0.2s;pointer-events:none;font-size:14px;border-left:4px solid #ff2a55;}</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="top-bar"><div class="left-icons"><button class="search-icon" id="searchButton"><i class="fas fa-search"></i></button></div><div class="top-tabs"><a href="home.html" class="tab-link"><i class="fas fa-home"></i> لك</a><a href="following.html" class="tab-link"><i class="fas fa-user-plus"></i> المتابَعون</a><a href="search.html" class="tab-link"><i class="fas fa-compass"></i> استكشاف</a></div><div class="left-icons"><button class="live-icon" id="liveButton"><i class="fas fa-circle"></i><span>Live</span></button></div></div>
  <div class="page-container"><div class="section-title"><i class="fas fa-shield-alt"></i> المصادقة الثنائية</div><div class="card"><div class="qrcode"><i class="fas fa-qrcode" style="font-size:64px;color:#aaa;"></i></div><p>امسح رمز QR باستخدام تطبيق Google Authenticator أو Authy</p><div style="background:#2c2c2c;padding:8px;border-radius:12px;margin:12px 0;font-family:monospace;">ZT5X-7K9L-M2Q4-6W8R</div><input type="text" class="otp-input" id="otpCode" placeholder="000000" maxlength="6"><button class="btn-primary" id="verifyBtn">تفعيل</button><div class="switch-text" id="disable2FA">لدي بالفعل، تعطيل المصادقة</div></div></div>
  <div class="bottom-nav"><a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a><a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a><a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a><a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a></div>
  <div id="globalToast"></div>
  <script>
    document.getElementById('verifyBtn').addEventListener('click',()=>{ const code=document.getElementById('otpCode').value; if(code==='123456'){ alert('تم تفعيل المصادقة الثنائية بنجاح'); localStorage.setItem('2fa_enabled','true'); } else alert('رمز غير صحيح (جرب 123456)'); });
    document.getElementById('disable2FA').addEventListener('click',()=>{ localStorage.removeItem('2fa_enabled'); alert('تم تعطيل المصادقة الثنائية'); });
    document.getElementById('searchButton').onclick=()=>window.location.href='search.html';
    document.getElementById('liveButton').onclick=()=>window.location.href='live.html';
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.log);
  </script>
</body>
</html>
