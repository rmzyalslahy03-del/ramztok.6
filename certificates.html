<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | الشهادات</title>
  <style>/* نفس الأنماط أعلاه مع تعديل بسيط - للاختصار، سيتم استخدام نفس النمط العام */ *{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#000;color:white;height:100vh;overflow:hidden;}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;flex-direction:row-reverse;justify-content:space-around;align-items:center;padding:8px 0 12px;border-top:1px solid #222;z-index:100;}.nav-item{display:flex;flex-direction:column;align-items:center;color:#aaa;font-size:12px;text-decoration:none;transition:color 0.2s;}.nav-item i{font-size:24px;margin-bottom:3px;}.nav-item.active{color:#ff2a55;}.top-bar{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:90;}.left-icons{display:flex;gap:16px;}.search-icon,.live-icon{color:white;font-size:22px;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;}.top-tabs{display:flex;gap:30px;font-weight:bold;position:absolute;left:50%;transform:translateX(-50%);}.tab-link{color:#aaa;text-decoration:none;padding-bottom:4px;font-size:16px;}.tab-link.active{color:white;border-bottom:2px solid #ff2a55;}.page-container{padding:70px 16px 80px;height:100vh;overflow-y:auto;}.section-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:20px;}.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;}.cert-card{background:#1a1a1a;border-radius:24px;padding:20px;text-align:center;transition:transform 0.2s;border:1px solid #2c2c2c;}.cert-card:hover{transform:translateY(-3px);border-color:#ff2a55;}.cert-icon{font-size:48px;color:#ff2a55;margin-bottom:16px;}.cert-title{font-size:18px;font-weight:bold;margin-bottom:8px;}.cert-date{font-size:12px;color:#aaa;margin-bottom:12px;}.cert-desc{font-size:13px;color:#ccc;}.btn-outline{background:transparent;border:1px solid #ff2a55;padding:6px 16px;border-radius:30px;color:#ff2a55;cursor:pointer;margin-top:12px;}#globalToast{position:fixed;bottom:80px;left:20px;right:20px;background:#1f1f1f;color:white;padding:12px 16px;border-radius:40px;text-align:center;z-index:1000;opacity:0;transition:opacity 0.2s;pointer-events:none;font-size:14px;border-left:4px solid #ff2a55;}</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="top-bar"><div class="left-icons"><button class="search-icon" id="searchButton"><i class="fas fa-search"></i></button></div><div class="top-tabs"><a href="home.html" class="tab-link"><i class="fas fa-home"></i> لك</a><a href="following.html" class="tab-link"><i class="fas fa-user-plus"></i> المتابَعون</a><a href="search.html" class="tab-link"><i class="fas fa-compass"></i> استكشاف</a></div><div class="left-icons"><button class="live-icon" id="liveButton"><i class="fas fa-circle"></i><span>Live</span></button></div></div>
  <div class="page-container">
    <div class="section-title"><i class="fas fa-award"></i> شهادات التقدير والإنجازات</div>
    <div class="cert-grid">
      <div class="cert-card"><div class="cert-icon"><i class="fas fa-fire"></i></div><div class="cert-title">منشور رائج</div><div class="cert-date">حصلت عليها في 10 مايو 2026</div><div class="cert-desc">وصل أحد فيديوهاتك إلى أكثر من 100 ألف مشاهدة</div><button class="btn-outline" data-cert="رائج">مشاركة</button></div>
      <div class="cert-card"><div class="cert-icon"><i class="fas fa-heart"></i></div><div class="cert-title">قلب ذهبي</div><div class="cert-date">15 أبريل 2026</div><div class="cert-desc">حصل فيديو على أكثر من 10,000 إعجاب</div><button class="btn-outline" data-cert="قلب ذهبي">مشاركة</button></div>
      <div class="cert-card"><div class="cert-icon"><i class="fas fa-users"></i></div><div class="cert-title">مؤثر اجتماعي</div><div class="cert-date">1 مارس 2026</div><div class="cert-desc">وصل عدد متابعيك إلى 1000 متابع</div><button class="btn-outline" data-cert="مؤثر اجتماعي">مشاركة</button></div>
    </div>
  </div>
  <div class="bottom-nav"><a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a><a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a><a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a><a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a></div>
  <div id="globalToast"></div>
  <script>
    document.querySelectorAll('.btn-outline').forEach(btn => { btn.addEventListener('click', () => { alert('تم نسخ رابط الشهادة (وهمي)'); }); });
    document.getElementById('searchButton').onclick = () => window.location.href = 'search.html';
    document.getElementById('liveButton').onclick = () => window.location.href = 'live.html';
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.log);
  </script>
</body>
</html>
