<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | نسيت كلمة المرور</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    /* الشريط السفلي (رمزياً للتناسق) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid #222;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item i {
      font-size: 24px;
      margin-bottom: 3px;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 90;
    }

    .logo-area {
      font-size: 20px;
      font-weight: bold;
      color: #ff2a55;
    }

    .top-buttons {
      display: flex;
      gap: 12px;
    }

    .top-btn {
      background: none;
      border: none;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    .page-container {
      padding: 70px 20px 80px;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a1a;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .icon {
      font-size: 48px;
      color: #ff2a55;
      margin-bottom: 16px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: right;
    }

    .input-group input {
      width: 100%;
      padding: 14px;
      border-radius: 40px;
      border: none;
      background: #2c2c2c;
      color: white;
      font-size: 16px;
      outline: none;
      text-align: right;
    }

    .input-group input::placeholder {
      color: #666;
    }

    .btn-primary {
      background: #ff2a55;
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 16px;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .back-link {
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
      text-decoration: underline;
    }

    .message {
      margin-top: 16px;
      font-size: 13px;
      color: #4ade80;
    }

    .error {
      color: #ff4444;
    }

    #globalToast {
      position: fixed;
      bottom: 80px;
      left: 20px;
      right: 20px;
      background: #1f1f1f;
      color: white;
      padding: 12px 16px;
      border-radius: 40px;
      text-align: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      font-size: 14px;
      border-left: 4px solid #ff2a55;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <div class="top-bar">
    <div class="logo-area">RamzTok</div>
    <div class="top-buttons">
      <button class="top-btn" id="homeBtn">الرئيسية</button>
      <button class="top-btn" id="loginBtn">تسجيل الدخول</button>
    </div>
  </div>

  <div class="page-container">
    <div class="card">
      <div class="icon">
        <i class="fas fa-key"></i>
      </div>
      <div class="title">نسيت كلمة المرور؟</div>
      <div class="subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور</div>
      <div class="input-group">
        <input type="email" id="emailInput" placeholder="البريد الإلكتروني">
      </div>
      <button class="btn-primary" id="resetBtn">إرسال رابط إعادة التعيين</button>
      <div class="back-link" id="backToLoginBtn">العودة إلى تسجيل الدخول</div>
      <div id="statusMsg" class="message"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a>
    <a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a>
    <a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a>
  </div>

  <div id="globalToast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ----------------------------- تهيئة Supabase -----------------------------
    const SUPABASE_URL = 'https://fqowxtghefuykxyyrttk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_StGuaVLO7lfCsKF0Fr1dHQ_m10dbTOO';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // دوال مساعدة
    function showToast(msg, isError = false) {
      const toast = document.getElementById('globalToast');
      toast.textContent = msg;
      toast.style.opacity = '1';
      toast.style.backgroundColor = isError ? '#3a1e1e' : '#1f1f1f';
      toast.style.borderLeftColor = isError ? '#ff4444' : '#ff2a55';
      setTimeout(() => toast.style.opacity = '0', 3000);
    }

    const emailInput = document.getElementById('emailInput');
    const resetBtn = document.getElementById('resetBtn');
    const statusMsg = document.getElementById('statusMsg');
    const backToLoginBtn = document.getElementById('backToLoginBtn');
    const homeBtn = document.getElementById('homeBtn');
    const loginBtn = document.getElementById('loginBtn');

    // إرسال رابط إعادة التعيين
    async function sendResetLink() {
      const email = emailInput.value.trim();
      if (!email) {
        statusMsg.textContent = 'الرجاء إدخال البريد الإلكتروني';
        statusMsg.classList.add('error');
        return;
      }
      if (!email.includes('@') || !email.includes('.')) {
        statusMsg.textContent = 'الرجاء إدخال بريد إلكتروني صحيح';
        statusMsg.classList.add('error');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'جاري الإرسال...';
      statusMsg.textContent = '';
      statusMsg.classList.remove('error', 'message');

      try {
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/update-password.html'
        });
        if (error) throw error;
        statusMsg.textContent = '✅ تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني. يرجى التحقق من صندوق الوارد.';
        statusMsg.classList.add('message');
        emailInput.value = '';
      } catch (err) {
        console.error(err);
        statusMsg.textContent = '❌ فشل الإرسال: ' + (err.message || 'تأكد من صحة البريد الإلكتروني');
        statusMsg.classList.add('error');
      } finally {
        resetBtn.disabled = false;
        resetBtn.textContent = 'إرسال رابط إعادة التعيين';
      }
    }

    // أزرار التنقل
    backToLoginBtn.addEventListener('click', () => {
      window.location.href = 'auth.html';
    });
    homeBtn.addEventListener('click', () => {
      window.location.href = 'home.html';
    });
    loginBtn.addEventListener('click', () => {
      window.location.href = 'auth.html';
    });
    resetBtn.addEventListener('click', sendResetLink);

    // الضغط على Enter
    emailInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendResetLink();
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker مسجل', reg))
        .catch(err => console.log('فشل تسجيل Service Worker', err));
    }
  </script>
</body>
</html>
