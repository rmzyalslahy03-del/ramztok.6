<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>صندوق الوارد - RamzTok</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }

        .inbox-container {
            max-width: 500px;
            margin: 0 auto;
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            padding-bottom: 65px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #000;
            border-bottom: 0.5px solid #2c2c2c;
            flex-shrink: 0;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .header h1 {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .new-chat-btn {
            background: none;
            border: none;
            color: #ff0050;
            font-size: 22px;
            cursor: pointer;
        }

        .main-tabs {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            border-bottom: 0.5px solid #2c2c2c;
            background: #000;
            flex-shrink: 0;
        }

        .main-tab {
            padding: 12px 20px;
            background: none;
            border: none;
            color: #aaa;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .main-tab.active {
            color: white;
            border-bottom-color: #ff0050;
        }

        .sub-tabs {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            background: #111;
            border-bottom: 0.5px solid #2c2c2c;
            flex-shrink: 0;
            padding: 0 8px;
        }

        .sub-tab {
            padding: 10px 16px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            white-space: nowrap;
        }

        .sub-tab.active {
            color: #ff0050;
            border-bottom-color: #ff0050;
        }

        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            border-bottom: 0.5px solid #1f1f1f;
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:active {
            background: #111;
        }

        .item-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #2c2c2c;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 700;
            color: white;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .item-detail {
            font-size: 13px;
            color: #aaa;
            margin-top: 2px;
        }

        .item-time {
            font-size: 11px;
            color: #777;
        }

        .badge {
            background: #ff0050;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: bold;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* مودال المحادثة المتطور */
        .chat-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .chat-modal.open {
            transform: translateX(0);
        }

        .chat-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #000;
            border-bottom: 0.5px solid #2c2c2c;
            gap: 12px;
        }

        .chat-back {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .chat-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
        }

        .chat-name {
            flex: 1;
            font-weight: bold;
            color: white;
            font-size: 17px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-wrapper {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            position: relative;
        }

        .message-wrapper.sent {
            align-self: flex-end;
        }

        .message-wrapper.received {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 15px;
            word-wrap: break-word;
            position: relative;
        }

        .received .message-bubble {
            background: #2c2c2c;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .sent .message-bubble {
            background: #ff0050;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-status {
            font-size: 10px;
            margin-top: 4px;
            text-align: right;
            color: #aaa;
        }

        .media-attachment {
            max-width: 200px;
            border-radius: 16px;
            margin-top: 6px;
            cursor: pointer;
        }

        .reply-to {
            font-size: 12px;
            color: #ccc;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            margin-bottom: 4px;
        }

        .message-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-wrapper:hover .message-actions {
            opacity: 1;
        }

        .action-icon {
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .comment-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 1100;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .comment-modal.open {
            transform: translateY(0);
        }

        .comment-input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            background: #2c2c2c;
            border: none;
            color: white;
            margin: 10px 0;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #111;
            border-top: 0.5px solid #2c2c2c;
            gap: 8px;
            flex-wrap: wrap;
        }

        .attach-btn,
        .emoji-btn {
            background: #2c2c2c;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-input {
            flex: 1;
            background: #2c2c2c;
            border: none;
            border-radius: 30px;
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .send-btn {
            background: #ff0050;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 16px;
            background: #2c2c2c;
            border-radius: 30px;
            padding: 10px;
            gap: 8px;
            z-index: 1100;
            flex-wrap: wrap;
            max-width: 250px;
        }

        .emoji-picker.active {
            display: flex;
        }

        .emoji-option {
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.1s;
        }

        .emoji-option:active {
            transform: scale(1.2);
        }

        /* الشريط السفلي الموحد */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 12px;
            border-top: 1px solid #222;
            z-index: 200;
            max-width: 500px;
            margin: 0 auto;
            right: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            font-size: 12px;
            text-decoration: none;
            transition: color 0.2s;
            position: relative;
        }

        .nav-item i {
            font-size: 24px;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: #ff2a55;
        }

        .notification-count {
            position: absolute;
            top: -8px;
            right: -12px;
            background: #ffc107;
            color: #000;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            min-width: 18px;
            text-align: center;
        }

        #globalToast {
            position: fixed;
            bottom: 80px;
            left: 20px;
            right: 20px;
            background: #1f1f1f;
            color: white;
            padding: 12px 16px;
            border-radius: 40px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            font-size: 14px;
            border-left: 4px solid #ff2a55;
        }
    </style>
</head>
<body>

        // ========== دوال جلب البيانات من Supabase (مع دعم التجريبي) ==========
        async function fetchConversations() {
            try {
                const { data, error } = await supabaseClient
                    .from('conversations')
                    .select('*, participants!inner(user_id)')
                    .eq('participants.user_id', userId);
                if (error) throw error;
                return (data && data.length) ? data : demoConversations;

                return demoConversations;
            }
        }

                const { data, error } = await supabaseClient
                    .from('messages')
                    .select('*')
                    .eq('conversation_id', conversationId)
                    .order('created_at', { ascending: true });
                if (error) throw error;
                return (data && data.length) ? data : (demoMessages[conversationId] || []);

            // إضافة الأيموجي الأساسية المطلوبة
            const emojisList = ["❤️", "😂", "😮", "😢", "😡", "👍"];
            emojisList.forEach(emoji => {
                const span = document.createElement('span');
                span.className = 'emoji-option';
                span.textContent = emoji;
                span.dataset.emoji = emoji;
                span.addEventListener('click', () => {
                    messageInput.value += emoji;
                    messageInput.focus();
                    emojiPicker.classList.remove('active');
                });
                emojiPicker.appendChild(span);
            });
        }

        // ========== دوال المحادثات ==========
        async function renderConversations() {
            allConversations = await fetchConversations();
            if (!allConversations.length) {
                mainContent.innerHTML = '<div class="empty-state"><i class="far fa-comments"></i><p>لا توجد محادثات بعد</p></div>';
                return;
            }
            let html = '';
            for (let conv of allConversations) {
                const unread = conv.unread || 0;
                html += `
                    <div class="list-item" data-chat-id="${conv.id}">
                        <img src="${conv.avatar || 'https://randomuser.me/api/portraits/lego/1.jpg'}" class="item-avatar">
                        <div class="item-info">
                            <div class="item-name">${conv.name || 'محادثة'} ${conv.online ? '<span style="color:#4ade80; font-size:10px;">● متصل</span>' : ''}</div>
                            <div class="item-detail">${conv.last_message || ''}</div>
                        </div>
                        <div class="item-time">${conv.updated_at ? new Date(conv.updated_at).toLocaleTimeString() : ''}</div>
                        ${unread > 0 ? `<div class="badge">${unread}</div>` : ''}
                    </div>
                `;
            }
            mainContent.innerHTML = html;
            document.querySelectorAll('[data-chat-id]').forEach(el => {
                el.addEventListener('click', () => openChat(parseInt(el.dataset.chatId)));
            });
        }

        async function openChat(chatId) {
            activeChatId = chatId;
            currentConversation = allConversations.find(c => c.id === chatId);
            if (!currentConversation) return;
            chatNameSpan.innerText = currentConversation.name || 'محادثة';
            chatAvatar.src = currentConversation.avatar || 'https://randomuser.me/api/portraits/lego/1.jpg';
            currentMessages = await fetchMessages(chatId);
            renderChatMessages();
            chatModal.classList.add('open');
            if (currentConversation.unread > 0) {
                await supabaseClient.from('conversations').update({ unread: 0 }).eq('id', chatId);
                currentConversation.unread = 0;
                renderConversations();
            }
            setTimeout(() => chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight, 100);
            replyingToMessage = null;
            currentMediaFile = null;
            messageInput.placeholder = "اكتب رسالة...";
        }

        function formatMessageTime(date) {
            const d = new Date(date);
            const now = new Date();
            if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
            return d.toLocaleDateString('ar', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
        }

        function renderChatMessages() {
            chatMessagesDiv.innerHTML = '';
            let lastDate = null;
            currentMessages.forEach(msg => {
                const msgDate = new Date(msg.created_at).toDateString();
                if (lastDate !== msgDate) {
                    const dateDiv = document.createElement('div');
                    dateDiv.style.textAlign = 'center';
                    dateDiv.style.fontSize = '11px';
                    dateDiv.style.color = '#aaa';
                    dateDiv.style.margin = '8px 0';
                    dateDiv.innerText = new Date(msg.created_at).toLocaleDateString('ar');
                    chatMessagesDiv.appendChild(dateDiv);
                    lastDate = msgDate;
                }
                const wrapper = document.createElement('div');
                const isSent = (msg.sender_id === userId);
                wrapper.className = `message-wrapper ${isSent ? 'sent' : 'received'}`;
                let replyHtml = '';
                if (msg.reply_to) {
                    const repliedMsg = currentMessages.find(m => m.id === msg.reply_to);
                    if (repliedMsg) replyHtml = `<div class="reply-to">↩️ رد على: ${repliedMsg.text?.substring(0, 40)}</div>`;
                }
                let mediaHtml = '';
                if (msg.media_url) {
                    if (msg.media_type === 'image') mediaHtml = `<img src="${msg.media_url}" class="media-attachment" onclick="window.open('${msg.media_url}')">`;
                    else if (msg.media_type === 'video') mediaHtml = `<video src="${msg.media_url}" controls class="media-attachment"></video>`;
                }
                let statusHtml = '';
                if (isSent) {
                    let statusIcon = '';
                    if (msg.status === 'delivered') statusIcon = '<i class="fas fa-check" style="color:#aaa;"></i>';
                    else if (msg.status === 'seen') statusIcon = '<i class="fas fa-check-double" style="color:#20d5ec;"></i>';
                    else statusIcon = '<i class="fas fa-clock" style="color:#aaa;"></i>';
                    statusHtml = `<div class="message-status">${statusIcon} ${formatMessageTime(msg.created_at)}</div>`;
                } else {
                    statusHtml = `<div class="message-status">${formatMessageTime(msg.created_at)}</div>`;
                }
                let reactionsHtml = '';
                if (msg.reactions && msg.reactions.length) {
                    reactionsHtml = `<div style="display:flex; gap:4px; margin-top:4px;">${msg.reactions.map(r => `<span style="font-size:14px;">${r}</span>`).join('')}</div>`;
                }
                wrapper.innerHTML = `
                    ${replyHtml}
                    <div class="message-bubble">${msg.text || ''}${mediaHtml}</div>
                    ${reactionsHtml}
                    ${statusHtml}
                    <div class="message-actions">
                        <span class="action-icon" data-action="like"><i class="far fa-thumbs-up"></i> ${msg.reactions?.filter(r => r === '👍').length || 0}</span>
                        <span class="action-icon" data-action="comment"><i class="far fa-comment"></i> ${msg.comments_count || 0}</span>
                        <span class="action-icon" data-action="reply"><i class="fas fa-reply"></i></span>
                        <span class="action-icon" data-action="share"><i class="fas fa-share"></i></span>
                    </div>
                `;
                wrapper.dataset.msgId = msg.id;
                wrapper.querySelectorAll('[data-action]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = btn.dataset.action;
                        if (action === 'like') toggleLike(msg.id);
                        else if (action === 'comment') openCommentModal(msg);
                        else if (action === 'reply') setReply(msg);
                        else if (action === 'share') shareVideo(msg);
                    });
                });
                chatMessagesDiv.appendChild(wrapper);
            });
        }

        async function toggleLike(msgId) {
            const msg = currentMessages.find(m => m.id === msgId);
            if (!msg.reactions) msg.reactions = [];
            const idx = msg.reactions.indexOf('👍');
            if (idx === -1) msg.reactions.push('👍');
            else msg.reactions.splice(idx, 1);
            await supabaseClient.from('messages').update({ reactions: msg.reactions }).eq('id', msgId);
            renderChatMessages();
        }

        function openCommentModal(msg) {
            commentTargetMsg = msg;
            commentModalDiv.classList.add('open');
            commentInput.value = '';
            commentInput.focus();
        }

        async function submitComment() {
            const text = commentInput.value.trim();
            if (!text || !commentTargetMsg) return;
            const newComment = { message_id: commentTargetMsg.id, user_id: userId, text: text, created_at: new Date().toISOString() };
            await supabaseClient.from('message_comments').insert(newComment);
            const { count } = await supabaseClient.from('message_comments').select('*', { count: 'exact' }).eq('message_id', commentTargetMsg.id);
            await supabaseClient.from('messages').update({ comments_count: count }).eq('id', commentTargetMsg.id);
            commentTargetMsg.comments_count = count;
            renderChatMessages();
            commentModalDiv.classList.remove('open');
            showToast('تم إضافة التعليق');
        }

        function setReply(msg) {
            replyingToMessage = msg;
            messageInput.placeholder = `رد على: ${msg.text?.substring(0, 30)}...`;
            messageInput.focus();
        }

        function shareVideo(msg) {
            if (msg.media_url && msg.media_type === 'video') {
                const targetUser = prompt("أدخل اسم المستخدم لمشاركة الفيديو معه:");
                if (targetUser) showToast(`تم إرسال الفيديو إلى ${targetUser}`);
            } else showToast("لا يوجد فيديو للمشاركة", true);
        }

        async function sendMessage() {
            let text = messageInput.value.trim();
            if (!text && !currentMediaFile) return;
            if (!activeChatId) return;
            const newMsg = {
                conversation_id: activeChatId,
                sender_id: userId,
                text: text || "",
                status: 'sent',
                created_at: new Date().toISOString(),
                reactions: [],
                reply_to: replyingToMessage ? replyingToMessage.id : null,
                media_url: currentMediaFile ? currentMediaFile.url : null,
                media_type: currentMediaFile ? currentMediaFile.type : null
            };
            const { data, error } = await supabaseClient.from('messages').insert(newMsg).select();
            if (error) {
                showToast("فشل إرسال الرسالة", true);
                return;
            }
            currentMessages.push(data[0]);
            renderChatMessages();
            messageInput.value = '';
            replyingToMessage = null;
            currentMediaFile = null;
            messageInput.placeholder = "اكتب رسالة...";
            chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
            await supabaseClient.from('conversations').update({ last_message: text || 'وسائط', updated_at: new Date().toISOString() }).eq('id', activeChatId);
            renderConversations();
            setTimeout(async () => {
                await supabaseClient.from('messages').update({ status: 'delivered' }).eq('id', data[0].id);
                renderChatMessages();
                setTimeout(async () => {
                    await supabaseClient.from('messages').update({ status: 'seen' }).eq('id', data[0].id);
                    renderChatMessages();
                }, 2000);
            }, 1000);
        }

        // ========== دوال التبويبات الفرعية ==========
        function renderSubTabs() {
            if (currentMainTab === 'chats' || currentMainTab === 'requests' || currentMainTab === 'privacy') return '';
            if (currentMainTab === 'notifications') {
                return `
                    <div class="sub-tabs">
                        <button class="sub-tab ${currentSubTab === 'shares' ? 'active' : ''}" data-sub="shares">مشاركة محتواك</button>
                        <button class="sub-tab ${currentSubTab === 'mentions' ? 'active' : ''}" data-sub="mentions">أشار إليك</button>
                        <button class="sub-tab ${currentSubTab === 'tags' ? 'active' : ''}" data-sub="tags">ذكرك</button>
                    </div>
                `;
            } else if (currentMainTab === 'interactions') {
                return `
                    <div class="sub-tabs">
                        <button class="sub-tab ${currentSubTab === 'likes' ? 'active' : ''}" data-sub="likes">إعجابات</button>
                        <button class="sub-tab ${currentSubTab === 'favorites' ? 'active' : ''}" data-sub="favorites">أضاف للمفضلة</button>
                        <button class="sub-tab ${currentSubTab === 'comments' ? 'active' : ''}" data-sub="comments">تعليقات</button>
                        <button class="sub-tab ${currentSubTab === 'profileViews' ? 'active' : ''}" data-sub="profileViews">زيارات الملف</button>
                    </div>
                `;
            } else if (currentMainTab === 'system') {
                return `
                    <div class="sub-tabs">
                        <button class="sub-tab ${currentSubTab === 'system' ? 'active' : ''}" data-sub="system">النظام</button>
                        <button class="sub-tab ${currentSubTab === 'support' ? 'active' : ''}" data-sub="support">الدعم</button>
                        <button class="sub-tab ${currentSubTab === 'warnings' ? 'active' : ''}" data-sub="warnings">تحذيرات</button>
                        <button class="sub-tab ${currentSubTab === 'guidelines' ? 'active' : ''}" data-sub="guidelines">إرشادات</button>
                        <button class="sub-tab ${currentSubTab === 'friendsPosts' ? 'active' : ''}" data-sub="friendsPosts">منشورات الأصدقاء</button>
                    </div>
                `;
            }
            return '';
        }

        function renderSubContent() {
            if (currentMainTab === 'notifications') {
                let data = [];
                if (currentSubTab === 'shares') data = notificationsData.shares;
                else if (currentSubTab === 'mentions') data = notificationsData.mentions;
                else data = notificationsData.tags;
                if (!data.length) return '<div class="empty-state">لا توجد إشعارات</div>';
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="list-item">
                            <img src="${item.avatar}" class="item-avatar">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-detail">${item.action}: ${item.detail}</div>
                            </div>
                            <div class="item-time">${item.time}</div>
                        </div>
                    `;
                });
                return html;
            } else if (currentMainTab === 'interactions') {
                let data = [];
                if (currentSubTab === 'likes') data = interactionsData.likes;
                else if (currentSubTab === 'favorites') data = interactionsData.favorites;
                else if (currentSubTab === 'comments') data = interactionsData.comments;
                else data = interactionsData.profileViews;
                if (!data.length) return '<div class="empty-state">لا توجد تفاعلات</div>';
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="list-item">
                            <img src="${item.avatar}" class="item-avatar">
                            <div class="item-info">
                                <div class="item-name">${item.name}</div>
                                <div class="item-detail">${item.action}: ${item.detail || ''}</div>
                            </div>
                            <div class="item-time">${item.time}</div>
                        </div>
                    `;
                });
                return html;
            } else if (currentMainTab === 'system') {
                let data = [];
                if (currentSubTab === 'system') data = systemData.system;
                else if (currentSubTab === 'support') data = systemData.support;
                else if (currentSubTab === 'warnings') data = systemData.warnings;
                else if (currentSubTab === 'guidelines') data = systemData.guidelines;
                else data = systemData.friendsPosts;
                if (!data.length) return '<div class="empty-state">لا توجد إشعارات</div>';
                let html = '';
                data.forEach(item => {
                    html += `
                        <div class="list-item">
                            ${item.avatar ? `<img src="${item.avatar}" class="item-avatar">` : '<div class="item-avatar" style="background:#333; display:flex; align-items:center; justify-content:center;"><i class="fas fa-bell"></i></div>'}
                            <div class="item-info">
                                <div class="item-name">${item.title || item.name || 'نظام'}</div>
                                <div class="item-detail">${item.detail || item.action || ''}</div>
                            </div>
                            <div class="item-time">${item.time}</div>
                        </div>
                    `;
                });
                return html;
            }
            return '';
        }

        async function renderRequests() {
            if (!messageRequests.length) return '<div class="empty-state"><i class="far fa-envelope"></i><p>لا توجد طلبات مراسلة</p></div>';
            let html = '';
            messageRequests.forEach(req => {
                html += `
                    <div class="list-item">
                        <img src="${req.avatar}" class="item-avatar">
                        <div class="item-info">
                            <div class="item-name">${req.name} ${req.verified ? '<i class="fas fa-check-circle" style="color:#20d5ec;"></i>' : ''}</div>
                            <div class="item-detail">${req.message}</div>
                        </div>
                        <div class="item-time">${req.time}</div>
                        <button class="badge" style="background:#2c2c2c; padding:6px 12px;" data-request-id="${req.id}">رد</button>
                    </div>
                `;
            });
            return html;
        }

        async function renderPrivacy() {
            let statusText = onlineStatus === 'online' ? 'نشط (علامة زرقاء)' : 'مخفي (علامة سوداء)';
            let statusIcon = onlineStatus === 'online' ? '<i class="fas fa-circle" style="color:#4ade80;"></i>' : '<i class="fas fa-circle" style="color:#333;"></i>';
            return `
                <div style="padding:20px;">
                    <div style="background:#1a1a1a; border-radius:16px; padding:16px;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h3 style="color:white;">حالة الظهور للأصدقاء</h3>
                                <p style="color:#aaa; margin-top:8px;">${statusText}</p>
                            </div>
                            <div style="font-size:32px;">${statusIcon}</div>
                        </div>
                        <button id="toggleStatusBtn" style="background:#ff0050; border:none; padding:10px; border-radius:30px; color:white; margin-top:16px; width:100%; cursor:pointer;">
                            ${onlineStatus === 'online' ? 'تبديل إلى الوضع المخفي' : 'تبديل إلى النشط'}
                        </button>
                    </div>
                </div>
            `;
        }

        async function renderMainContent() {
            let content = '';
            const subTabsHtml = renderSubTabs();
            if (currentMainTab === 'chats') {
                await renderConversations();
                return;
            } else if (currentMainTab === 'requests') {
                content = await renderRequests();
            } else if (currentMainTab === 'notifications' || currentMainTab === 'interactions' || currentMainTab === 'system') {
                mainContent.innerHTML = subTabsHtml + '<div id="subContent"></div>';
                const subContentDiv = document.getElementById('subContent');
                if (subContentDiv) subContentDiv.innerHTML = renderSubContent();
                document.querySelectorAll('.sub-tab').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        currentSubTab = btn.dataset.sub;
                        renderMainContent();
                    });
                });
                return;
            } else if (currentMainTab === 'privacy') {
                content = await renderPrivacy();
                mainContent.innerHTML = content;
                const toggleBtn = document.getElementById('toggleStatusBtn');
                if (toggleBtn) toggleBtn.addEventListener('click', () => {
                    onlineStatus = onlineStatus === 'online' ? 'offline' : 'online';
                    renderMainContent();
                });
                return;
            }
            mainContent.innerHTML = (subTabsHtml ? subTabsHtml : '') + content;
            document.querySelectorAll('[data-request-id]').forEach(btn => {
                btn.addEventListener('click', () => showToast("سيتم فتح محادثة مع هذا المستخدم قريباً"));
            });
        }

        function setMainTab(tabId) {
            currentMainTab = tabId;
            currentSubTab = null;
            if (tabId === 'notifications') currentSubTab = 'shares';
            else if (tabId === 'interactions') currentSubTab = 'likes';
            else if (tabId === 'system') currentSubTab = 'system';
            mainTabs.forEach(tab => {
                if (tab.dataset.main === tabId) tab.classList.add('active');
                else tab.classList.remove('active');
            });
            renderMainContent();
        }

        // ========== ربط الأحداث ==========
        document.getElementById('backToHomeBtn').addEventListener('click', () => window.location.href = 'home.html');
        mainTabs.forEach(tab => tab.addEventListener('click', () => setMainTab(tab.dataset.main)));
        closeChatBtn.addEventListener('click', () => chatModal.classList.remove('open'));
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
        attachBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*,video/*';
            input.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        currentMediaFile = {
                            type: file.type.startsWith('image/') ? 'image' : 'video',
                            url: ev.target.result,
                            name: file.name
                        };
                        messageInput.placeholder = "أضف نصاً (اختياري) ثم أرسل";
                    };
                    reader.readAsDataURL(file);
                }
            };
            input.click();
        });
        emojiBtn.addEventListener('click', () => emojiPicker.classList.toggle('active'));
        submitCommentBtn.addEventListener('click', submitComment);
        document.addEventListener('click', e => {
            if (!emojiBtn.contains(e.target) && !emojiPicker.contains(e.target)) emojiPicker.classList.remove('active');
            if (!commentModalDiv.contains(e.target) && e.target !== commentModalDiv && !e.target.closest('.action-icon[data-action="comment"]')) commentModalDiv.classList.remove('open');
        });
        newChatBtn.addEventListener('click', () => showToast("✨ قريباً: بدء محادثة جديدة"));

        buildEmojiPicker();
        setMainTab('chats');
    </script>
</body>
</html>
