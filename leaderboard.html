<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | لوحة المتصدرين</title>
  <style>/* نفس الأنماط العامة */ *{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#000;color:white;height:100vh;overflow:hidden;}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;flex-direction:row-reverse;justify-content:space-around;align-items:center;padding:8px 0 12px;border-top:1px solid #222;z-index:100;}.nav-item{display:flex;flex-direction:column;align-items:center;color:#aaa;font-size:12px;text-decoration:none;transition:color 0.2s;}.nav-item i{font-size:24px;margin-bottom:3px;}.nav-item.active{color:#ff2a55;}.top-bar{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:90;}.left-icons{display:flex;gap:16px;}.search-icon,.live-icon{color:white;font-size:22px;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;}.top-tabs{display:flex;gap:30px;font-weight:bold;position:absolute;left:50%;transform:translateX(-50%);}.tab-link{color:#aaa;text-decoration:none;padding-bottom:4px;font-size:16px;}.tab-link.active{color:white;border-bottom:2px solid #ff2a55;}.page-container{padding:70px 16px 80px;height:100vh;overflow-y:auto;}.section-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:20px;}.tabs-selector{display:flex;gap:12px;justify-content:center;margin-bottom:24px;}.tab-leader{background:#1a1a1a;border:none;padding:8px 20px;border-radius:30px;color:#aaa;cursor:pointer;transition:0.2s;}.tab-leader.active{background:#ff2a55;color:white;}.rank-list{background:#0a0a0a;border-radius:24px;overflow:hidden;}.rank-item{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #222;}.rank-number{width:40px;font-weight:bold;font-size:18px;color:#ff2a55;}.rank-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;margin-left:12px;}.rank-info{flex:1;}.rank-name{font-weight:bold;}.rank-username{font-size:12px;color:#aaa;}.rank-score{font-weight:bold;color:#ff2a55;}#globalToast{position:fixed;bottom:80px;left:20px;right:20px;background:#1f1f1f;color:white;padding:12px 16px;border-radius:40px;text-align:center;z-index:1000;opacity:0;transition:opacity 0.2s;pointer-events:none;font-size:14px;border-left:4px solid #ff2a55;}</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="top-bar"><div class="left-icons"><button class="search-icon" id="searchButton"><i class="fas fa-search"></i></button></div><div class="top-tabs"><a href="home.html" class="tab-link"><i class="fas fa-home"></i> لك</a><a href="following.html" class="tab-link"><i class="fas fa-user-plus"></i> المتابَعون</a><a href="search.html" class="tab-link"><i class="fas fa-compass"></i> استكشاف</a></div><div class="left-icons"><button class="live-icon" id="liveButton"><i class="fas fa-circle"></i><span>Live</span></button></div></div>
  <div class="page-container">
    <div class="section-title"><i class="fas fa-trophy"></i> لوحة المتصدرين</div>
    <div class="tabs-selector"><button class="tab-leader active" data-type="likes">❤️ الإعجابات</button><button class="tab-leader" data-type="followers">👥 المتابعين</button><button class="tab-leader" data-type="coins">💰 العملات</button></div>
    <div class="rank-list" id="rankList"><div style="padding:20px;text-align:center;">جاري التحميل...</div></div>
  </div>
  <div class="bottom-nav"><a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a><a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a><a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a><a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a></div>
  <div id="globalToast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://fqowxtghefuykxyyrttk.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_StGuaVLO7lfCsKF0Fr1dHQ_m10dbTOO';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentType = 'likes';
    function formatNumber(n){ if(n>=1e9) return (n/1e9).toFixed(1).replace(/\.0$/,'')+'B'; if(n>=1e6) return (n/1e6).toFixed(1).replace(/\.0$/,'')+'M'; if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K'; return n.toString(); }
    async function loadLeaderboard(type){ const container=document.getElementById('rankList'); container.innerHTML='<div style="padding:20px;text-align:center;">جاري التحميل...</div>'; let data=[]; if(type==='likes'){ const {data:videos}=await supabaseClient.from('videos').select('user_name, likes'); const agg={}; videos.forEach(v=>{ agg[v.user_name]=(agg[v.user_name]||0)+v.likes; }); data=Object.entries(agg).map(([name,score])=>({name,score})).sort((a,b)=>b.score-a.score).slice(0,20); } else if(type==='followers'){ const {data:follows}=await supabaseClient.from('follows').select('followed_user'); const agg={}; follows.forEach(f=>{ agg[f.followed_user]=(agg[f.followed_user]||0)+1; }); data=Object.entries(agg).map(([name,score])=>({name,score})).sort((a,b)=>b.score-a.score).slice(0,20); } else if(type==='coins'){ const {data:wallet}=await supabaseClient.from('wallet').select('user_id, balance'); const {data:profiles}=await supabaseClient.from('profiles').select('user_name'); const map=new Map(); wallet.forEach(w=>map.set(w.user_id,w.balance||0)); data=profiles.map(p=>({name:p.user_name,score:map.get(p.user_name)||0})).sort((a,b)=>b.score-a.score).slice(0,20); }
      if(!data.length){ container.innerHTML='<div style="padding:20px;text-align:center;">لا توجد بيانات كافية</div>'; return; }
      let html=''; data.forEach((item,idx)=>{ html+=`<div class="rank-item"><div class="rank-number">${idx+1}</div><img class="rank-avatar" src="https://randomuser.me/api/portraits/lego/${(idx%10)+1}.jpg"><div class="rank-info"><div class="rank-name">${item.name}</div><div class="rank-username">@${item.name}</div></div><div class="rank-score">${formatNumber(item.score)}</div></div>`; }); container.innerHTML=html; }
    document.querySelectorAll('.tab-leader').forEach(btn=>{ btn.addEventListener('click',()=>{ document.querySelectorAll('.tab-leader').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); currentType=btn.dataset.type; loadLeaderboard(currentType); }); });
    loadLeaderboard('likes');
    document.getElementById('searchButton').onclick=()=>window.location.href='search.html';
    document.getElementById('liveButton').onclick=()=>window.location.href='live.html';
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.log);
  </script>
</body>
</html>
