<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | تسجيلات البث</title>
  <style>/* نفس الأنماط العامة */ *{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#000;color:white;height:100vh;overflow:hidden;}.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:flex;flex-direction:row-reverse;justify-content:space-around;align-items:center;padding:8px 0 12px;border-top:1px solid #222;z-index:100;}.nav-item{display:flex;flex-direction:column;align-items:center;color:#aaa;font-size:12px;text-decoration:none;transition:color 0.2s;}.nav-item i{font-size:24px;margin-bottom:3px;}.nav-item.active{color:#ff2a55;}.top-bar{position:fixed;top:0;left:0;width:100%;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:90;}.left-icons{display:flex;gap:16px;}.search-icon,.live-icon{color:white;font-size:22px;background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;}.top-tabs{display:flex;gap:30px;font-weight:bold;position:absolute;left:50%;transform:translateX(-50%);}.tab-link{color:#aaa;text-decoration:none;padding-bottom:4px;font-size:16px;}.tab-link.active{color:white;border-bottom:2px solid #ff2a55;}.page-container{padding:70px 16px 80px;height:100vh;overflow-y:auto;}.section-title{font-size:22px;font-weight:bold;text-align:center;margin-bottom:20px;}.replays-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}.replay-card{background:#1a1a1a;border-radius:20px;overflow:hidden;cursor:pointer;transition:transform 0.2s;}.replay-card:hover{transform:scale(0.98);}.replay-thumb{aspect-ratio:16/9;background:#2c2c2c;display:flex;align-items:center;justify-content:center;font-size:48px;color:#ff2a55;}.replay-info{padding:12px;}.replay-title{font-weight:bold;margin-bottom:4px;}.replay-date{font-size:11px;color:#aaa;}#globalToast{position:fixed;bottom:80px;left:20px;right:20px;background:#1f1f1f;color:white;padding:12px 16px;border-radius:40px;text-align:center;z-index:1000;opacity:0;transition:opacity 0.2s;pointer-events:none;font-size:14px;border-left:4px solid #ff2a55;}</style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="top-bar"><div class="left-icons"><button class="search-icon" id="searchButton"><i class="fas fa-search"></i></button></div><div class="top-tabs"><a href="home.html" class="tab-link"><i class="fas fa-home"></i> لك</a><a href="following.html" class="tab-link"><i class="fas fa-user-plus"></i> المتابَعون</a><a href="search.html" class="tab-link"><i class="fas fa-compass"></i> استكشاف</a></div><div class="left-icons"><button class="live-icon" id="liveButton"><i class="fas fa-circle"></i><span>Live</span></button></div></div>
  <div class="page-container"><div class="section-title"><i class="fas fa-video"></i> تسجيلات البث المباشر</div><div class="replays-grid" id="replaysGrid"><div style="text-align:center;padding:40px;">جاري التحميل...</div></div></div>
  <div class="bottom-nav"><a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a><a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a><a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a><a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a><a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a></div>
  <div id="globalToast"></div>
  <script>
    const replays = [{ title: "بث مباشر - تحديثات التطبيق", date: "2026-05-10", thumbnail: null }, { title: "لقاء خاص مع المطورين", date: "2026-05-05", thumbnail: null }, { title: "حفلة رأس السنة", date: "2025-12-31", thumbnail: null }];
    const container = document.getElementById('replaysGrid');
    function render(){ if(replays.length===0){ container.innerHTML='<div style="text-align:center;padding:40px;">لا توجد تسجيلات بعد</div>'; return; } let html=''; replays.forEach(r=>{ html+=`<div class="replay-card" data-title="${r.title}"><div class="replay-thumb"><i class="fas fa-play-circle"></i></div><div class="replay-info"><div class="replay-title">${r.title}</div><div class="replay-date">${new Date(r.date).toLocaleDateString('ar')}</div></div></div>`; }); container.innerHTML=html; document.querySelectorAll('.replay-card').forEach(card=>{ card.addEventListener('click',()=>{ alert(`سيتم تشغيل التسجيل: ${card.dataset.title}`); }); }); } render();
    document.getElementById('searchButton').onclick=()=>window.location.href='search.html';
    document.getElementById('liveButton').onclick=()=>window.location.href='live.html';
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(console.log);
  </script>
</body>
</html>
