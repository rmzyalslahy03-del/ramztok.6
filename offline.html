<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | وضع عدم الاتصال</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid #222;
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #aaa;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-item i {
      font-size: 24px;
      margin-bottom: 3px;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      z-index: 90;
    }

    .left-icons {
      display: flex;
      gap: 16px;
    }

    .search-icon, .live-icon {
      color: white;
      font-size: 22px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .top-tabs {
      display: flex;
      gap: 30px;
      font-weight: bold;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .tab-link {
      color: #aaa;
      text-decoration: none;
      padding-bottom: 4px;
      font-size: 16px;
    }

    .tab-link.active {
      color: white;
      border-bottom: 2px solid #ff2a55;
    }

    .offline-container {
      padding: 70px 16px 80px;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .offline-icon {
      font-size: 80px;
      color: #ff2a55;
      margin-bottom: 20px;
    }

    .offline-title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .offline-desc {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 32px;
      max-width: 300px;
    }

    .btn-primary {
      background: #ff2a55;
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 16px;
    }

    .cached-videos {
      width: 100%;
      margin-top: 30px;
      text-align: right;
    }

    .cached-title {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .video-list {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 12px;
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #333;
    }

    .video-thumb {
      width: 48px;
      height: 64px;
      background: #333;
      border-radius: 8px;
    }

    .video-info {
      flex: 1;
    }

    .clear-cache {
      background: none;
      border: none;
      color: #ff2a55;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <div class="top-bar">
    <div class="left-icons">
      <button class="search-icon" id="searchButton"><i class="fas fa-search"></i></button>
    </div>
    <div class="top-tabs">
      <a href="home.html" class="tab-link">لك</a>
      <a href="following.html" class="tab-link">المتابَعون</a>
      <a href="search.html" class="tab-link">استكشاف</a>
    </div>
    <div class="left-icons">
      <button class="live-icon" id="liveButton"><i class="fas fa-video"></i><span>Live</span></button>
    </div>
  </div>

  <div class="offline-container">
    <div class="offline-icon">
      <i class="fas fa-wifi-slash"></i>
    </div>
    <div class="offline-title">وضع عدم الاتصال</div>
    <div class="offline-desc">
      يمكنك مشاهدة الفيديوهات المخزنة محلياً وتجربة التطبيق دون اتصال بالإنترنت.
    </div>
    <button class="btn-primary" id="refreshCacheBtn">تحديث الكاش الآن</button>

    <div class="cached-videos">
      <div class="cached-title">📀 الفيديوهات المخزنة محلياً</div>
      <div class="video-list" id="cachedList">
        <div class="video-item"><div class="video-thumb"></div><div class="video-info">لا توجد فيديوهات مخزنة بعد</div></div>
      </div>
      <button class="clear-cache" id="clearCacheBtn">مسح الكاش</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a>
    <a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a>
    <a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a>
  </div>

  <script>
    // عرض الفيديوهات المخزنة في IndexedDB (مثال)
    function loadCachedVideos() {
      const container = document.getElementById('cachedList');
      // مثال باستخدام localStorage لتخزين بعض البيانات (يمكنك توسيعه لـ IndexedDB)
      const cached = JSON.parse(localStorage.getItem('offline_videos') || '[]');
      if (cached.length === 0) {
        container.innerHTML = '<div class="video-item"><div class="video-thumb"></div><div class="video-info">لا توجد فيديوهات مخزنة بعد. قم بمشاهدة فيديو في وضع الاتصال أولاً.</div></div>';
        return;
      }
      let html = '';
      cached.forEach(v => {
        html += `
          <div class="video-item">
            <div class="video-thumb" style="background-image:url(${v.poster}); background-size:cover;"></div>
            <div class="video-info">${v.title || 'فيديو'}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    document.getElementById('refreshCacheBtn').addEventListener('click', () => {
      alert('يمكنك حفظ الفيديوهات أثناء الاتصال بالإنترنت بالنقر على زر "حفظ" في صفحة الفيديو.');
    });
    document.getElementById('clearCacheBtn').addEventListener('click', () => {
      localStorage.removeItem('offline_videos');
      loadCachedVideos();
      alert('تم مسح الكاش');
    });
    loadCachedVideos();

    document.getElementById('searchButton').onclick = () => window.location.href = 'search.html';
    document.getElementById('liveButton').onclick = () => window.location.href = 'live.html';
  </script>
</body>
</html>
