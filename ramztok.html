<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>RamzTok | الموقع الرسمي</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; color: white; height: 100vh; overflow: hidden; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: flex; flex-direction: row-reverse; justify-content: space-around; align-items: center; padding: 8px 0 12px; border-top: 1px solid #222; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; font-size: 12px; text-decoration: none; transition: color 0.2s; }
    .nav-item i { font-size: 24px; margin-bottom: 3px; }
    .nav-item.active { color: #ff2a55; }
    .top-bar { position: fixed; top: 0; left: 0; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 90; }
    .left-icons { display: flex; gap: 16px; }
    .search-icon, .live-icon { color: white; font-size: 22px; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .top-tabs { display: flex; gap: 30px; font-weight: bold; position: absolute; left: 50%; transform: translateX(-50%); }
    .tab-link { color: #aaa; text-decoration: none; padding-bottom: 4px; font-size: 16px; }
    .tab-link.active { color: white; border-bottom: 2px solid #ff2a55; }
    .page-container { padding: 70px 20px 80px; height: 100vh; overflow-y: auto; text-align: center; }
    .content-card { background: #1a1a1a; border-radius: 24px; padding: 30px; margin-top: 20px; }
    .btn-back { background: #ff2a55; border: none; padding: 10px 20px; border-radius: 30px; color: white; cursor: pointer; margin-top: 20px; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  <div class="top-bar">
    <div class="left-icons"><button class="search-icon" id="searchButton"><i class="fas fa-search"></i></button></div>
    <div class="top-tabs">
      <a href="home.html" class="tab-link">لك</a>
      <a href="following.html" class="tab-link">المتابَعون</a>
      <a href="search.html" class="tab-link">استكشاف</a>
    </div>
    <div class="left-icons"><button class="live-icon" id="liveButton"><i class="fas fa-video"></i><span>Live</span></button></div>
  </div>
  <div class="page-container">
    <div class="content-card">
      <i class="fas fa-globe" style="font-size: 60px; color: #ff2a55; margin-bottom: 20px;"></i>
      <h2>RamzTok – المنصة الرسمية</h2>
      <p style="margin: 16px 0;">مرحباً بك في الموقع الرسمي لتطبيق RamzTok. يمكنك متابعة آخر الأخبار والتحديثات.</p>
      <p>للتواصل: <strong>info@ramztok.com</strong></p>
      <button class="btn-back" onclick="window.location.href='profile.html'">العودة إلى الملف الشخصي</button>
    </div>
  </div>
  <div class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="fas fa-home"></i><span>الرئيسية</span></a>
    <a href="friends.html" class="nav-item"><i class="fas fa-users"></i><span>الأصدقاء</span></a>
    <a href="upload.html" class="nav-item"><i class="fas fa-plus-circle"></i><span>إنشاء</span></a>
    <a href="inbox.html" class="nav-item"><i class="fas fa-inbox"></i><span>الوارد</span></a>
    <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>الملف</span></a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.getElementById('searchButton').onclick = () => window.location.href = 'search.html';
    document.getElementById('liveButton').onclick = () => window.location.href = 'live.html';
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
