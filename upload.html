<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff2a55">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RamzTok">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <title>رفع فيديو - RamzTok</title>
    <style>
        :root {
            --primary: #ff2a55;
            --bg: #000;
            --surface: #1a1a1a;
            --surface-light: #2c2c2c;
            --text: #fff;
            --text-secondary: #aaa;
            --border: #333;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }
        .app-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .camera-screen {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        .camera-view video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s, filter 0.3s;
            background: #000;
        }
        .flash-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
            z-index: 50;
        }
        .flash-overlay.active { opacity: 1; transition: opacity 0s; }
        .top-tools {
            position: absolute;
            top: 20px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 30;
        }
        .tool-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .tool-btn:active { transform: scale(0.92); background: var(--primary); }
        .duration-bar {
            position: absolute;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 30;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .duration-btn {
            padding: 8px 18px;
            border-radius: 24px;
            background: transparent;
            color: #ccc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .duration-btn.active { background: var(--primary); color: #fff; }
        .tab-bar {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 30;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            padding: 5px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .tab-btn {
            padding: 8px 18px;
            border-radius: 24px;
            background: transparent;
            color: #ccc;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active { background: var(--primary); color: #fff; }
        .zoom-panel {
            position: absolute;
            bottom: 220px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            gap: 8px;
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .zoom-panel.visible { opacity: 1; pointer-events: auto; }
        .zoom-panel button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .bottom-toolbar {
            position: absolute;
            bottom: 100px;
            left: 0;
            right: 0;
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 0 16px 8px;
            z-index: 30;
            scrollbar-width: thin;
        }
        .bottom-toolbar::-webkit-scrollbar { display: none; }
        .tool-chip {
            flex-shrink: 0;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
        }
        .record-bar {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 30;
        }
        .record-btn {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: transparent;
            border: 3px solid rgba(255,255,255,0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-btn .inner-dot {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--primary);
            transition: all 0.3s;
        }
        .record-btn.recording .inner-dot { width: 32px; height: 32px; border-radius: 8px; }
        .record-timer {
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            transition: 0.2s;
            text-align: center;
            margin-bottom: 6px;
        }
        .record-timer.visible { opacity: 1; }
        .slide-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #151515;
            border-radius: 28px 28px 0 0;
            z-index: 300;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.35s;
            max-height: 70vh;
            overflow-y: auto;
        }
        .slide-panel.open { transform: translateY(0); }
        .panel-handle {
            width: 40px;
            height: 4px;
            background: #555;
            border-radius: 4px;
            margin: 0 auto 20px;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 12px;
            margin: 16px 0;
        }
        .grid-item {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .grid-item.selected { border-color: var(--primary); background: rgba(255,42,85,0.15); }
        .tiny-btn {
            background: var(--primary);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 36px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .overlay-bg {
            position: fixed;
            top:0;left:0;width:100%;height:100%;
            background: rgba(0,0,0,0.65);
            z-index: 280;
            display: none;
            backdrop-filter: blur(3px);
        }
        .overlay-bg.active { display: block; }
        .preview-screen {
            position: fixed;
            top:0;left:0;
            width:100%;height:100%;
            background: #000;
            z-index: 250;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }
        .preview-screen.active { display: flex; }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
        }
        .preview-video-container {
            width: 100%;
            aspect-ratio: 9/16;
            background: #000;
        }
        .preview-video-container video { width: 100%; height: 100%; object-fit: contain; }
        .preview-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        textarea, input, select {
            width: 100%;
            padding: 14px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            color: white;
            font-size: 15px;
            font-family: inherit;
        }
        .privacy-option {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 20px;
            margin: 8px 0;
        }
        .hashtag-suggestions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .hashtag-chip {
            background: #2c2c2c;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            cursor: pointer;
        }
        .post-btn {
            background: var(--primary);
            padding: 16px;
            border-radius: 40px;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .post-btn:disabled { background: #444; }
        .rights-option {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 20px;
        }
        .progress-container {
            width: 100%;
            background: #333;
            border-radius: 20px;
            margin: 8px 0;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            width: 0%;
            height: 8px;
            background: var(--primary);
            transition: width 0.3s;
        }
        .mention-input-wrapper {
            position: relative;
        }
        .mention-suggestions {
            position: absolute;
            bottom: 100%;
            left: 0;
            right: 0;
            background: #2a2a2a;
            border-radius: 16px;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            z-index: 50;
        }
        .mention-suggestion {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #444;
        }
        .tools-library {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 28px;
            margin: 8px 0;
        }
        .tool-item {
            background: #2c2c2c;
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .templates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 12px;
        }
        .template-card {
            background: #2a2a2a;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 120px;
            left: 20px;
            right: 20px;
            background: #2a2a2a;
            color: white;
            padding: 14px;
            border-radius: 40px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            transform: translateY(30px);
            transition: 0.25s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .hidden-canvas { position: absolute; top: -9999px; visibility: hidden; }
    </style>

<body>
<div class="app-container">
    <div id="cameraScreen" class="camera-screen">
        <div class="camera-view">
            <video id="cameraPreview" autoplay playsinline muted></video>
            <div class="flash-overlay" id="flashOverlay"></div>
            <div class="top-tools">
                <button class="tool-btn" id="closeBtn"><i class="fas fa-times"></i></button>
                <button class="tool-btn" id="musicBtnTop"><i class="fas fa-music"></i></button>
                <button class="tool-btn" id="flashBtn"><i class="fas fa-bolt"></i></button>
                <button class="tool-btn" id="flipCameraBtn"><i class="fas fa-sync-alt"></i></button>
                <button class="tool-btn" id="galleryBtn"><i class="fas fa-images"></i></button>
            </div>
            <div class="duration-bar">
                <button class="duration-btn" data-dur="15">15s</button>
                <button class="duration-btn active" data-dur="60">60s</button>
                <button class="duration-btn" data-dur="180">3د</button>
                <button class="duration-btn" data-dur="300">5د</button>
                <button class="duration-btn" data-dur="600">10د</button>
            </div>
            <div class="tab-bar">
                <button class="tab-btn active" data-mode="post">منشور</button>
                <button class="tab-btn" data-mode="live">مباشر</button>
            </div>
            <div class="zoom-panel" id="zoomPanel">
                <button id="zoomOutBtn">−</button>
                <span class="zoom-value" id="zoomValue">1.0x</span>
                <button id="zoomInBtn">+</button>
                <button id="zoomResetBtn"><i class="fas fa-undo-alt"></i></button>
            </div>
        </div>
        <div class="bottom-toolbar">
            <div class="tool-chip" data-panel="effects"><i class="fas fa-magic"></i><span>تأثيرات</span></div>
            <div class="tool-chip" data-panel="music"><i class="fas fa-headphones"></i><span>موسيقى</span></div>
            <div class="tool-chip" data-panel="image2video"><i class="fas fa-images"></i><span>صور→فيديو</span></div>
            <div class="tool-chip" data-panel="edit"><i class="fas fa-cut"></i><span>قص</span></div>
            <div class="tool-chip" data-panel="speed"><i class="fas fa-tachometer-alt"></i><span>سرعة</span></div>
            <div class="tool-chip" data-panel="enhance"><i class="fas fa-sliders-h"></i><span>تحسين</span></div>
            <div class="tool-chip" data-panel="design"><i class="fas fa-pen-fancy"></i><span>نص</span></div>
            <div class="tool-chip" data-panel="audio"><i class="fas fa-volume-up"></i><span>صوت</span></div>
            <div class="tool-chip" data-panel="templates"><i class="fas fa-layer-group"></i><span>قوالب</span></div>
        </div>
        <div class="record-bar">
            <div style="display: flex; flex-direction: column; align-items: center;">
                <div class="record-timer" id="recordTimer">00:00</div>
                <button class="record-btn" id="recordBtn"><div class="inner-dot"></div></button>
            </div>
        </div>
    </div>

    <div id="previewScreen" class="preview-screen">
        <div class="preview-header">
            <button id="backToCameraBtn"><i class="fas fa-arrow-right"></i> عودة</button>
            <span style="font-weight:bold;">معاينة وتحرير</span>
            <button id="homeFromPreviewBtn"><i class="fas fa-home"></i></button>
        </div>
        <div class="preview-video-container"><video id="videoPlayer" controls playsinline></video></div>
        <div class="preview-body">
            <input type="text" id="videoTitle" placeholder="عنوان الفيديو (اختياري)">
            <textarea id="captionInput" rows="2" placeholder="وصف الفيديو..."></textarea>
            <div class="mention-input-wrapper">
                <input type="text" id="mentionInput" placeholder="@ أشر إلى مستخدمين آخرين (مثال: @ramz_tok)">
                <div id="mentionSuggestions" class="mention-suggestions"></div>
            </div>
            <div>
                <input type="text" id="hashtagsInput" placeholder="#هاشتاج1 #هاشتاج2">
                <div class="hashtag-suggestions">
                    <span class="hashtag-chip" data-tag="#ramztok">#ramztok</span>
                    <span class="hashtag-chip" data-tag="#فيديو">#فيديو</span>
                    <span class="hashtag-chip" data-tag="#تحدي">#تحدي</span>
                </div>
            </div>
            <div class="tools-library">
                <div class="tool-item" data-panel="effects"><i class="fas fa-magic"></i> تأثيرات</div>

            <div class="privacy-option"><input type="radio" name="privacy" value="public" checked id="privacyPublic"><label for="privacyPublic">🌍 عام (الجميع)</label></div>
            <div class="privacy-option"><input type="radio" name="privacy" value="followers" id="privacyFollowers"><label for="privacyFollowers">👥 متابعيني فقط</label></div>
            <div class="privacy-option"><input type="radio" name="privacy" value="private" id="privacyPrivate"><label for="privacyPrivate">🔒 خاص (أنا فقط)</label></div>

    </div>
</div>

<div class="overlay-bg" id="overlayBg"></div>

<div class="slide-panel" id="musicPanel"><div class="panel-handle"></div><div class="panel-title">🎵 موسيقى</div><div class="grid-4" id="musicGrid"></div><button class="tiny-btn" id="uploadMusicBtn2">رفع موسيقى</button><button class="tiny-btn" style="background:#444;" onclick="closePanel('musicPanel')">إغلاق</button></div>

<div class="slide-panel" id="templatesPanel"><div class="panel-handle"></div><div class="panel-title">🎨 قوالب كانفا</div><div class="templates-grid" id="templatesGrid"></div><button class="tiny-btn" onclick="closePanel('templatesPanel')">إغلاق</button></div>

<input type="file" id="musicFileInput" accept="audio/*" hidden>

            applyFilter();
            if(facingMode === 'environment') {

                    await track.applyConstraints({ advanced: [{ torch: false }] });

            if(err.name === 'NotAllowedError') msg = 'الرجاء السماح باستخدام الكاميرا والميكروفون';
            else if(err.name === 'NotFoundError') msg = 'لا توجد كاميرا متصلة بالجهاز';
            else if(err.name === 'NotReadableError') msg = 'الكاميرا مستخدمة من تطبيق آخر، أغلقه وحاول مجدداً';
            showToast(msg, true);
            try {
                const altConstraints = { video: { facingMode: facingMode } };
                stream = await navigator.mediaDevices.getUserMedia(altConstraints);
                $('#cameraPreview').srcObject = stream;
                applyFilter();

    // دوال معالجة الفيديو (تأثيرات، قص، نص، تحسين، حقوق)
    async function processVideoWithFilter(blob, filter) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(blob);
            const video = document.createElement('video'); video.src = url; video.muted = true;
            video.onloadedmetadata = () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                const stream = canvas.captureStream(30);
                const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
                const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
                rec.start();
                video.currentTime = 0;
                const draw = () => {
                    if(video.currentTime >= video.duration) { rec.stop(); return; }
                    ctx.filter = filter;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    video.currentTime += 1/30;
                    requestAnimationFrame(draw);
                };
                video.play(); video.onplay = draw;
                rec.onstop = () => { const newBlob = new Blob(chunks, { type: 'video/webm' }); URL.revokeObjectURL(url); resolve(newBlob); };
            };
        });
    }
    async function trimVideo(blob, startSec, endSec) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(blob);
            const video = document.createElement('video'); video.src = url;
            video.onloadedmetadata = () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                const stream = canvas.captureStream(30);
                const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
                const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
                rec.start();
                let current = startSec;
                const draw = () => {
                    if(current >= endSec) { rec.stop(); return; }
                    video.currentTime = current;
                    video.onseeked = () => {
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        current += 1/30;
                        requestAnimationFrame(draw);
                    };
                };
                draw();
                rec.onstop = () => { const newBlob = new Blob(chunks, { type: 'video/webm' }); URL.revokeObjectURL(url); resolve(newBlob); };
            };
        });
    }
    async function addTextOverlay(blob, text, size, color) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(blob);
            const video = document.createElement('video'); video.src = url; video.muted = true;
            video.onloadedmetadata = () => {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                const stream = canvas.captureStream(30);
                const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
                const chunks = []; rec.ondataavailable = e => chunks.push(e.data);
                rec.start();
                video.currentTime = 0;
                const draw = () => {
                    if(video.currentTime >= video.duration) { rec.stop(); return; }
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    ctx.font = `bold ${size}px 'Segoe UI'`; ctx.fillStyle = color; ctx.textAlign = 'center';
                    ctx.fillText(text, canvas.width/2, canvas.height/2);
                    video.currentTime += 1/30;
                    requestAnimationFrame(draw);
                };
                video.play(); video.onplay = draw;
                rec.onstop = () => { const newBlob = new Blob(chunks, { type: 'video/webm' }); URL.revokeObjectURL(url); resolve(newBlob); };
            };
        });
    }

    $('#videoFileInput').onchange = e => { if(e.target.files[0]) { videoBlob = e.target.files[0]; showPreview(); } else showToast('اختر فيديو صحيح', true); };
    $('#recordBtn').onclick = () => { if(isLiveMode) showToast('البث المباشر قيد التطوير', true); else isRecording ? stopRecording() : startRecording(); };
    $$('.duration-btn').forEach(b => b.onclick = function() { $$('.duration-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); maxRecordTime = parseInt(this.dataset.dur); });
    $$('.tab-btn').forEach(b => b.onclick = function() { $$('.tab-btn').forEach(x=>x.classList.remove('active')); this.classList.add('active'); isLiveMode = this.dataset.mode === 'live'; });
    $('#zoomInBtn').onclick = () => setZoom(currentZoom+0.5);
    $('#zoomOutBtn').onclick = () => setZoom(currentZoom-0.5);
    $('#zoomResetBtn').onclick = () => setZoom(1);
    $('#postBtn').onclick = publishVideoWithProgress;
    $('#musicBtnTop').onclick = () => openPanel('musicPanel');
    $('#uploadMusicBtn2').onclick = () => $('#musicFileInput').click();
    $('#musicFileInput').onchange = e => {
        if(e.target.files[0]) {
            selectedMusic = { name: e.target.files[0].name, url: URL.createObjectURL(e.target.files[0]) };
            $('#musicBtnTop').classList.add('active'); closePanel('musicPanel'); buildMusicGrid();
        }
    };
    $$('.tool-chip').forEach(chip => chip.onclick = function() { const panel = this.dataset.panel; if(panel) openPanel(panel+'Panel'); });
    $$('.hashtag-chip').forEach(chip => chip.onclick = function() { const tag = this.dataset.tag; $('#hashtagsInput').value += ' '+tag; });
    $$('.tool-item').forEach(item => item.onclick = function() { const panel = this.dataset.panel; if(panel) openPanel(panel+'Panel'); });

    $('#applyTrimBtn').onclick = async () => { await applyTrim(); closePanel('editPanel'); };
    $('#applySpeedBtn').onclick = () => { showToast('ميزة تغيير السرعة قيد التطوير', false); closePanel('speedPanel'); };
    $('#applyEnhanceBtn').onclick = async () => { await applyEnhanceToCurrent(); closePanel('enhancePanel'); };
    $('#addOverlayBtn').onclick = async () => { await applyTextOverlayToCurrent(); closePanel('designPanel'); };
    $('#applyAudioBtn').onclick = () => { showToast('تم ضبط الصوت (سينطبق عند الحفظ)', false); closePanel('audioPanel'); };

    buildEffectsGrid(); buildMusicGrid(); buildTemplatesGrid(); initCamera();
    if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script>
</body>
</html>
